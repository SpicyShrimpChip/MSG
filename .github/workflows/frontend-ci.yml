name: Frontend CI

# main 대상 모든 PR에서 실행한다. build-and-lint가 main 보호의 필수 검사라서 PR에는 경로 필터를 걸지 않는다
# (필터가 있으면 frontend 밖만 바꾼 PR은 검사가 안 돌아 머지가 막힌다)
# push는 frontend 변경이 있을 때만 실행
on:
  push:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: ["main"]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행 취소
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "24" # 로컬 개발 환경과 맞춤
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      # 커밋 훅(lint-staged)이 형식을 고쳐 주지만, 훅을 건너뛰거나 GitHub 웹에서 고친 경우를 여기서 잡는다
      # 실패하면 frontend에서 npm run format 후 커밋
      - name: 형식 검사 (Prettier)
        run: npm run format:check

      # 러스트 소스(wasm/conversation-core)를 고치고 npm run build:wasm 결과를 커밋하지 않았는지 (러스트 없이 해시로 확인)
      - name: WASM 빌드 결과 확인
        run: npm run check:wasm

      - name: 테스트
        run: npm test

      - name: 빌드 확인
        run: npm run build
  # 대화 처리 러스트 크레이트(frontend/wasm/conversation-core) 단위 테스트·린트. 머지 필수 검사는 아니다
  wasm-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/wasm/conversation-core

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 러스트 테스트
        run: cargo test --locked

      - name: 러스트 린트 (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings
