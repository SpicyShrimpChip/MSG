name: Backend CI

# main 대상 push·PR 중 backend 변경이 있을 때만 실행
#
# 아직 main 보호의 필수 검사가 아니다(규칙셋 "backend CI required"는 만들어 두고 꺼 둠). 필수로 켜려면 순서대로:
#   1) 이 파일의 pull_request에서 paths 줄을 지운다(필터가 있으면 backend 밖만 바꾼 PR이 머지되지 않는다)
#   2) GitHub Settings → Rules → Rulesets → "backend CI required"를 Active로 바꾼다
# 필수 검사 이름은 job 이름과 같아야 한다(build-and-test, postgres-test). job 이름을 바꾸면 규칙셋도 같이 고친다
on:
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행 취소
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 운영 이미지(backend/Dockerfile)가 만들어지는지 PR에서 확인한다. 올리지 않으므로 테스트를 기다리지 않고 같이 돌린다.
  # 의존성 내려받기 층은 GitHub Actions 캐시(type=gha)에서 다시 쓴다(build.gradle이 그대로면 Maven Central에 다시 받으러 가지 않는다)
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 이미지 만들기
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

  # main에 머지되면 테스트 두 개가 통과한 뒤 이미지를 만들어 GHCR(ghcr.io/spicyshrimpchip/msg-backend)에 올린다.
  # 서버는 deploy/deploy.sh로 이 이미지를 받는다. 이미지에는 비밀값이 없다(실행할 때 환경변수로 넘긴다)
  docker-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-and-test, postgres-test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 커밋 7자리
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # latest는 서버가 받는 이름, sha-*는 문제가 생겼을 때 이전 이미지로 되돌리는 이름
      - name: 이미지 만들고 올리기
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          # 예전 docker push와 같은 단일 이미지로 올린다(빌드 증명서 목록을 따로 붙이지 않음)
          provenance: false
          tags: |
            ghcr.io/spicyshrimpchip/msg-backend:latest
            ghcr.io/spicyshrimpchip/msg-backend:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

  # H2 메모리 DB로 빌드·전체 테스트
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Java 17 설정
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      # gradle-wrapper.jar가 공식 배포본인지 확인한다.
      # v6부터 캐시 기능이 별도 상용 약관(gradle-actions-caching)으로 바뀌어, MIT이고 Node 24를 쓰는 v5에 둔다(11/25)
      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v5

      - name: 빌드·테스트
        run: ./gradlew build --no-daemon

  # 같은 테스트를 실제 PostgreSQL 16(+pgvector)으로 실행: Flyway 마이그레이션, UNIQUE 제약, vector 확장 확인
  postgres-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # 작업이 끝나면 사라지는 CI 전용 임시 컨테이너의 값이라 비밀값이 아니다
          POSTGRES_PASSWORD: ci-root-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/msg_test
      # pgTest를 JVM 4개로 나눠 각자 msg_1_test ~ msg_4_test를 쓴다(아래 db/create-test-db-shards.sh가 만든다)
      TEST_DB_SHARDS: "4"
      DB_USERNAME: msg_app
      DB_PASSWORD: ci-app-password
      DB_MIGRATION_USERNAME: msg_migrator
      DB_MIGRATION_PASSWORD: ci-migrator-password
      PGPASSWORD: ci-root-password

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Java 17 설정
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      # 로컬 setup-local-postgres.sh와 같은 구성(계정 2개, 최소 권한, vector 확장은 슈퍼유저가 미리 설치)
      - name: 테스트 DB·계정 만들기
        run: |
          psql -h 127.0.0.1 -U postgres <<'SQL'
          CREATE ROLE msg_migrator LOGIN PASSWORD 'ci-migrator-password';
          CREATE ROLE msg_app LOGIN PASSWORD 'ci-app-password';
          CREATE DATABASE msg_test OWNER msg_migrator ENCODING 'UTF8' TEMPLATE template0;
          REVOKE ALL ON DATABASE msg_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE msg_test TO msg_app;
          \connect msg_test
          CREATE EXTENSION IF NOT EXISTS vector;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO msg_app;
          GRANT ALL ON SCHEMA public TO msg_migrator;
          ALTER DEFAULT PRIVILEGES FOR ROLE msg_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO msg_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE msg_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO msg_app;
          SQL
          # 나눠 돌릴 테스트 DB(msg_1_test ~ msg_4_test)도 같은 권한으로 만든다
          DB_HOST=127.0.0.1 ./db/create-test-db-shards.sh

      - name: PostgreSQL 통합 테스트
        run: |
          # 실행할 때마다 새 JWT 키를 만든다 (저장하지 않음)
          export JWT_SECRET="$(openssl rand -base64 48)"
          ./gradlew pgTest --no-daemon
