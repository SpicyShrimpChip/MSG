<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSG · My Study Guide</title>
    <meta
      name="description"
      content="ChatGPT·Claude와 공부한 대화를 모아 개념별로 아는 것과 모르는 것을 근거와 함께 보여 주고, 다음 공부 순서를 다시 짜 주는 학습 도우미예요."
    />
    <!-- 링크 미리보기(카카오톡·슬랙·디스코드 등). 이미지는 상대 주소를 못 읽는 곳이 있어 운영 주소 전체로 쓴다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MSG" />
    <meta property="og:title" content="MSG · My Study Guide" />
    <meta
      property="og:description"
      content="AI와 공부한 기록에서 모르는 것을 찾아요. GPT, Claude, Gemini가 따로 판단한 결과를 비교해 보여 줘요."
    />
    <meta property="og:url" content="https://lms-seven-tawny.vercel.app/" />
    <meta
      property="og:image"
      content="https://lms-seven-tawny.vercel.app/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MSG 로고와 복습 노트. 공개키에 빨간 동그라미와 '여기부터 다시' 표시"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 화면을 그리기 전에 다크모드를 먼저 적용해 흰 화면이 번쩍이지 않게 한다
      // (저장 키·값 형식은 src/store/useThemeStore.ts와 같아야 한다)
      try {
        var saved = JSON.parse(localStorage.getItem('ai-lms-theme') || '{}');
        var preference = (saved.state && saved.state.preference) || 'system';
        var dark =
          preference === 'dark' ||
          (preference === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        // 저장소를 읽지 못하면 밝은 모드로 둔다
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
