plugins {
	id 'java'
	// 팀 확정 버전은 Spring Boot 3.x (Initializr 기본값 4.x가 아님에 주의)
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.msg'
version = '0.0.1-SNAPSHOT'

// 내 PC의 JDK 버전과 관계없이 Java 17 문법·API로만 컴파일한다 (CI는 Java 17)
tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = 'UTF-8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// 테이블 구조 변경 이력 관리 (src/main/resources/db/migration)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Access Token(JWT) 서명·검증
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 학습자료 PDF 본문 추출 (텍스트 PDF만, 서버 안에서 읽고 외부로 보내지 않는다. 스캔 PDF는 OCR이 필요해 미지원)
	implementation 'org.apache.pdfbox:pdfbox:3.0.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트·DB 없이 빠르게 띄울 때 쓰는 메모리 DB (기본 프로필)
	runtimeOnly 'com.h2database:h2'
	// 로컬(local)·운영(prod) 프로필의 기본 DB: PostgreSQL + pgvector (10/28 멘토링 추천으로 확정, MySQL에서 이주)
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트를 JVM 여러 개로 나눠 동시에 돌린다(CPU 절반, 최대 4개). JVM마다 메모리 DB·스프링 컨텍스트가 따로라 서로 섞이지 않는다.
// 4개로 나눴을 때 로컬 H2 테스트가 71초 → 43초였다(11/25). CI 러너(4 vCPU)에서는 2개
def testForks = Math.min(4, Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)))

// ./gradlew test: H2 메모리 DB로 실행 (PostgreSQL 없이도 돈다)
tasks.named('test') {
	useJUnitPlatform()
	maxParallelForks = testForks
}

// ./gradlew pgTest: 같은 테스트를 로컬·원격 PostgreSQL(pgvector)의 테스트 전용 DB(msg_test)로 실행한다.
// 접속 계정·비밀번호는 backend/.env(커밋 안 됨) 또는 환경변수에서 읽고, DB 주소만 테스트 DB로 바꾼다.
// 테스트는 데이터를 지우므로 이름이 _test로 끝나는 DB가 아니면 시작하지 않는다 (테스트 코드의 TestDatabaseGuard도 한 번 더 막는다)
def testDbUrl = System.getenv('TEST_DB_URL') ?: 'jdbc:postgresql://localhost:5432/msg_test'
// 나눠 돌릴 수. 테스트 DB msg_1_test ~ msg_N_test가 있어야 한다(db/create-test-db-shards.sh). 기본 1이면 예전처럼 msg_test 하나로 돈다.
// 내 PC는 ~/.gradle/gradle.properties의 msgTestDbShards=4, CI는 TEST_DB_SHARDS 환경변수로 켠다. JVM마다 DB를 고르는 곳은 테스트의 TestDatabaseShard
def testDbShards = ((findProperty('msgTestDbShards') ?: System.getenv('TEST_DB_SHARDS') ?: '1') as String).toInteger()
tasks.register('pgTest', Test) {
	description = 'PostgreSQL 테스트 DB(msg_test)로 전체 테스트를 실행한다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	maxParallelForks = Math.max(1, testDbShards)
	systemProperty 'msg.test.db.shards', Math.max(1, testDbShards)
	systemProperty 'spring.profiles.active', 'local'
	environment 'DB_URL', testDbUrl
	doFirst {
		def database = (testDbUrl =~ /^jdbc:[a-z]+:\/\/[^\/]+\/([^?;]+)/)
		if (!database.find() || !database.group(1).endsWith('_test')) {
			throw new GradleException("pgTest는 이름이 _test로 끝나는 DB에서만 실행한다 (서비스 DB 보호): ${testDbUrl}")
		}
	}
	shouldRunAfter tasks.named('test')
}

// ./gradlew bootRun: 기본은 로컬 PostgreSQL(local 프로필). SPRING_PROFILES_ACTIVE로 바꿀 수 있다
tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}
