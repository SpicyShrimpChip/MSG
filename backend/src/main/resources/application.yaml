# 공통 설정 + 기본 프로필(H2 메모리 DB). ./gradlew test는 이 설정으로 돈다.
# 로컬 PostgreSQL은 application-local.yaml, 운영은 application-prod.yaml. 비밀값은 여기에 쓰지 않는다
server:
  port: 8080

spring:
  application:
    name: backend

  # backend/.env(커밋 안 됨)가 있으면 DB 비밀번호·JWT 시크릿을 읽는다. 환경변수가 있으면 환경변수가 우선한다
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:h2:mem:lms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  # 테이블은 Flyway 마이그레이션(db/migration)으로만 만들고, Hibernate는 엔티티와 맞는지 검사만 한다
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩 컬렉션(문항 보기·개념 등)을 문항마다 따로 읽지 않고 IN 쿼리로 묶어 읽는다 (N+1 방지)
        default_batch_fetch_size: 100

  # db/seed: 로컬 확인용 샘플 데이터 (운영 프로필에서는 빠진다)
  # db/vector(pgvector 확장)는 H2에 없어서 PostgreSQL을 쓰는 local·prod 프로필에서만 추가한다
  flyway:
    locations: classpath:db/migration,classpath:db/seed

  # 학습자료 올리기 한도. 파일 한 개 20MB(Material.MAX_FILE_SIZE와 같은 값), 요청 전체는 제목 등 글자 칸을 더한 여유를 둔다.
  # 한도를 넘으면 서버가 끝까지 받지 않고 413으로 끊는다
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

app:
  # 업로드 원본 저장소. 원본은 AI 분석에 다시 쓰므로 자료나 과목을 지울 때까지 보관한다
  # TODO(미결): 원본의 장기 보관 기간·자동 삭제 정책, AWS S3 등 운영 저장소는 정해지지 않았다 (docs/backend-design.md)
  storage:
    type: local
    local:
      # 상대 경로는 서버를 실행한 폴더 기준(./gradlew bootRun이면 backend/uploads). 이 폴더는 .gitignore에 있다
      root: ${STORAGE_LOCAL_ROOT:uploads}
    # 지우지 못한 파일(file_deletion_task)을 다시 지우는 간격
    cleanup-retry-interval: 10m

  # AI 대화 가져오기 요청 한 번의 최대 크기. 프론트는 1MB(MAX_REQUEST_BYTES, nginx 기본 한도) 안으로 나눠 보내고,
  # 메시지 하나는 20,000자, 제목은 500자로 맞춰 보낸다 (frontend/src/utils/conversation/send.ts)
  conversation-import:
    max-request-size: 2MB

  # 회원가입 자동 가입 방지 (Cloudflare Turnstile). 비밀 키가 비면 확인하지 않는다 (로컬·테스트)
  # 프론트 사이트 키(VITE_TURNSTILE_SITE_KEY)와 같이 켠다. 확인 서버에 닿지 못하면 가입을 막는다
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    timeout: 5s
    # true면 비밀 키가 비었을 때 서버가 뜨지 않는다. 운영(application-prod.yaml)은 true
    required: false

  # 사용자가 보는 화면 주소. 소셜 로그인 콜백이 끝나면 이 주소의 화면(/auth/social/done 등)으로 돌려보낸다
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  # 카카오 로그인. 키는 환경변수(또는 backend/.env)로만 넣는다. REST API 키·Client Secret·Redirect URI 중 하나라도 비면 끈다(로컬·테스트·CI).
  # Redirect URI는 카카오 콘솔에 등록한 사용자 주소의 /api/auth/kakao/callback. 어드민 키가 비면 탈퇴 때 연결 끊기를 건너뛴다
  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      admin-key: ${KAKAO_ADMIN_KEY:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
      auth-base-url: https://kauth.kakao.com
      api-base-url: https://kapi.kakao.com
      timeout: 5s

  # 탈퇴 뒤 같은 이메일로 다시 가입하지 못하는 기간 (탈퇴·재가입으로 사용자별 AI 한도를 우회하지 못하게).
  # 이메일 원문이 아니라 hash-secret으로 건 HMAC 값만 저장한다. 키가 비어 있으면 꺼진다(기록도 확인도 하지 않음).
  # 기간·보관 항목은 개인정보 처리방침 4번과 같게 맞춘다. 운영 중에는 키를 바꾸지 않는다(바꾸면 그때까지의 제한이 풀린다)
  rejoin:
    restrict-days: 30
    hash-secret: ${REJOIN_HASH_SECRET:}
    cleanup-interval: 6h

  # 하루 AI 모델 호출 상한. 다시 부르기도 한 번으로 센다. 0 이하면 상한 없음. 날짜는 zone 기준으로 나눈다
  # calls: 서비스 전체 (계정을 여러 개 만들어도 넘을 수 없는 비용 상한)
  # user-calls: 사용자 한 명의 몫. 분석·퀴즈 만들기·AI 채점·자료 개념 뽑기·개념 설명의 호출을 모두 합쳐 센다(기능별 한도와 따로).
  #   계정 몇 개로 서비스 전체 상한을 다 써 버리지 못하게 calls보다 훨씬 작게 둔다. 분석 1번 = 모델 3번(다시 부르면 최대 6번)
  # TODO(미결): 500·40은 근거 없는 임시값. 실사용자 테스트의 실제 사용량과 제공사 콘솔 지출 한도를 보고 정한다
  ai-daily-limit:
    calls: ${AI_DAILY_CALL_LIMIT:500}
    user-calls: ${AI_USER_DAILY_CALL_LIMIT:40}
    zone: Asia/Seoul

  # 학습 분석에 쓰는 AI 모델. 키와 모델 이름은 환경변수(또는 backend/.env)로만 넣는다. 둘 중 하나라도 비면 그 모델은 "미설정"으로
  # 부르지 않는다. 모델 이름은 비용·품질을 보고 팀이 정한다 (기본값 없음)
  llm:
    timeout: 60s
    # 시간 초과·한도 초과·서버 오류일 때 다시 부르는 횟수
    max-retries: 1
    retry-backoff: 2s
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      base-url:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:}
      base-url:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
      base-url:

  # 학습 대화 개념 분석. 외부 모델로 보내는 양과 호출 횟수(=비용)를 줄이는 값
  analysis:
    max-input-chars: 30000
    max-message-chars: 1500
    # 키워드가 들어간 메시지 앞뒤로 함께 보낼 메시지 수
    context-window: 1
    max-output-tokens: 4000
    # 사용자 한 명이 24시간 안에 시작할 수 있는 분석 수 (분석 한 번에 모델 최대 3번 호출)
    daily-run-limit: 10
    running-timeout: 10m
    # 분석 한 번에서 모델을 기다리는 전체 시간 (늦은 모델은 시간 초과로 두고 나머지를 저장).
    # 배포에서 Vercel이 /api를 넘기며 첫 응답을 120초까지만 기다리므로 그보다 넉넉히 짧게, 프론트 timeout(115초)보다도 짧게 둔다
    deadline: 100s

  # 개념별 숙련도 점수 (domain/analysis, 11/5 설계안 초기값). 전부 근거 없는 초기 가정이라 사용자 테스트 뒤 조정한다.
  # 점수 = (Σ무게·값 + 1) ÷ (Σ무게 + 2). 산식을 바꾸면 formula-version을 올린다 (docs/frontend-requests.md 5-10절)
  mastery:
    formula-version: "1"
    # 퀴즈 문제 하나, 대화 한 건의 근거 무게 (퀴즈가 직접 확인한 결과라 대화보다 크게)
    quiz-weight: 1.0
    conversation-weight: 0.5
    # 대화 판단별 값 (스스로 활용 / 재설명 요청·부분 이해 / 이해 못 함)
    understood-value: 1.0
    partial-value: 0.3
    not-understood-value: 0.0
    # 근거 무게 합이 이보다 작으면 점수 대신 "근거 부족"
    min-evidence-weight: 3.0
    # 점수 < 0.4 보완 필요, 0.7 이상 강점, 그 사이 보통
    needs-work-below: 0.4
    strong-from: 0.7

  # 퀴즈 만들기·AI 채점 (domain/quiz). 키가 없으면 만들기는 503, 주관식 의미 판단·서술형 채점은 "채점 대기"로 둔다
  quiz:
    # 퀴즈를 만들 때 쓸 모델 순서. 설정된 첫 모델 하나만 부르고 실패하면 남은 시간 안에서 다음 모델로 넘어간다 (gpt, claude, gemini)
    generation-providers: gpt, claude, gemini
    max-question-count: 10
    mock-exam-max-question-count: 20
    # 비용 상한 (24시간, 사용자 한 명): 만들기 요청 수, AI 채점 실행 수(처음·다시 채점), 실제 모델 요청 수(재시도·실패 포함)
    daily-generation-limit: 20
    daily-grading-limit: 30
    daily-model-call-limit: 150
    # 시간 예산 (자료 핵심 개념 뽑기·개념 설명도 generation-deadline). Vercel 프록시 한도 120초와 프론트 timeout 115초보다 짧게 둔다
    generation-deadline: 100s
    grading-deadline: 100s
    # 마감 시각이 없는 옛 만들기 기록(V7)을 끝난 것으로 볼 시간
    running-timeout: 5m
    generation-max-output-tokens: 6000
    grading-max-output-tokens: 3000
    # 학습자료 핵심 개념 뽑기·개념 설명 응답 길이 상한
    concept-max-output-tokens: 2000
    concept-note-max-output-tokens: 3000
    # 개념 설명은 개념마다 한 번씩 부르므로 24시간 요청 수를 따로 둔다 (daily-model-call-limit도 함께 적용)
    concept-note-daily-limit: 40
    # 결과 판단 기준 (코드 규칙. 숙련도 점수 산식은 미결이라 여기서 만들지 않는다)
    assessment:
      min-graded-questions: 3
      ready-rate: 0.8
      concept-min-rate: 0.6

  # 학습자료 본문을 외부 AI로 보내는 기능. 기본은 꺼짐: 제공사·이전 국가·보관 기간과 처리 근거를 처리방침에 확정한 뒤에만 켠다
  # (MATERIAL_CONTENT_ENABLED=true). 꺼져 있으면 자료 본문·핵심 개념 뽑기 요청을 거절하고 과목 개념으로만 문제를 만든다
  material-content:
    enabled: ${MATERIAL_CONTENT_ENABLED:false}
    max-chars: 12000
    max-pdf-pages: 100

  # Vite 프록시를 거쳐도 브라우저의 Origin(개발 서버 주소)이 그대로 오므로 개발 서버 주소를 허용해야 한다.
  # 5173이 이미 쓰이고 있으면 Vite가 5174로 띄운다. 운영은 application-prod.yaml에서 환경변수로만 받는다
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174

  jwt:
    # Base64로 인코딩한 32바이트 이상 키. 비어 있고 allow-ephemeral-secret이 true면 실행할 때마다 임시 키를 만든다
    secret: ${JWT_SECRET:}
    allow-ephemeral-secret: true
    issuer: msg
    access-token-ttl: 15m

  auth:
    refresh-token-ttl: 14d
    # 회전으로 방금 폐기된 Refresh Token이 이 시간 안에 다시 오면 재사용(탈취)으로 보지 않고 같은 세션에서 한 번 더 회전한다.
    # 탭 여러 개가 같은 쿠키로 거의 동시에 갱신하면 한쪽이 폐기된 토큰을 보내게 되기 때문이다 (#211).
    # 로그아웃·탈퇴·재사용 감지로 끝난 세션의 토큰은 이 시간 안이어도 받지 않는다. 0s면 유예 없이 바로 세션을 끊는다
    refresh-reuse-grace: 10s
    refresh-cookie:
      name: refresh_token
      # 인증 API에만 쿠키가 실리게 한다
      path: /api/auth
      # http://localhost 개발 환경에서는 false, 운영(HTTPS)은 true
      secure: false
      # 프론트와 API가 같은 출처(Vite 프록시·Vercel rewrite)라 Strict로 충분하다
      same-site: Strict
    login-attempt:
      # 같은 이메일·같은 IP에서 window 동안 max-failures번 틀리면 lock-duration 동안 막는다
      max-failures: 5
      window: 15m
      lock-duration: 15m
      # 한 IP에서 여러 이메일로 시도하는 경우
      max-failures-per-ip: 50
    # 한 IP의 가입 시도 수 (이메일 가입·카카오 가입 마무리 합계). 계정을 대량으로 만들거나 가입 응답으로 이메일을 대량 확인하는 것을
    # 느리게 한다. 강의실처럼 여러 사람이 같은 IP로 가입할 수 있어 넉넉히 둔다. 0이면 제한하지 않는다
    signup-attempt:
      max-per-ip: 10
      window: 1h
