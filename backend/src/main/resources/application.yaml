# 공통 설정 + 기본 프로필(H2 메모리 DB). ./gradlew test는 이 설정으로 돈다.
# 로컬 PostgreSQL은 application-local.yaml, 운영은 application-prod.yaml. 비밀값은 여기에 쓰지 않는다
server:
  port: 8080

spring:
  application:
    name: backend

  # backend/.env(커밋 안 됨)가 있으면 DB 비밀번호·JWT 시크릿을 읽는다. 환경변수가 있으면 환경변수가 우선한다
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:h2:mem:lms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  # 테이블은 Flyway 마이그레이션(db/migration)으로만 만들고, Hibernate는 엔티티와 맞는지 검사만 한다
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # db/seed: 로컬 확인용 샘플 데이터 (운영 프로필에서는 빠진다)
  # db/vector(pgvector 확장)는 H2에 없어서 PostgreSQL을 쓰는 local·prod 프로필에서만 추가한다
  flyway:
    locations: classpath:db/migration,classpath:db/seed

  # 학습자료 올리기 한도. 파일 한 개 20MB(Material.MAX_FILE_SIZE와 같은 값), 요청 전체는 제목 등 글자 칸을 더한 여유를 둔다.
  # 한도를 넘으면 서버가 끝까지 받지 않고 413으로 끊는다
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

app:
  # 업로드 원본 저장소. 원본은 AI 분석에 다시 쓰므로 자료나 과목을 지울 때까지 보관한다
  # TODO(미결): 원본의 장기 보관 기간·자동 삭제 정책, AWS S3 등 운영 저장소는 정해지지 않았다 (docs/backend-design.md)
  storage:
    type: local
    local:
      # 상대 경로는 서버를 실행한 폴더 기준(./gradlew bootRun이면 backend/uploads). 이 폴더는 .gitignore에 있다
      root: ${STORAGE_LOCAL_ROOT:uploads}
    # 지우지 못한 파일(file_deletion_task)을 다시 지우는 간격
    cleanup-retry-interval: 10m

  # AI 대화 가져오기 요청 한 번의 최대 크기. 프론트는 1MB(MAX_REQUEST_BYTES, nginx 기본 한도) 안으로 나눠 보내고,
  # 메시지 하나는 20,000자, 제목은 500자로 맞춰 보낸다 (frontend/src/utils/conversation/send.ts)
  conversation-import:
    max-request-size: 2MB

  # 학습 분석에 쓰는 AI 모델. 키와 모델 이름은 환경변수(또는 backend/.env)로만 넣는다. 둘 중 하나라도 비면 그 모델은 "미설정"으로
  # 부르지 않는다. 모델 이름은 비용·품질을 보고 팀이 정한다 (기본값 없음)
  llm:
    timeout: 60s
    # 시간 초과·한도 초과·서버 오류일 때 다시 부르는 횟수
    max-retries: 1
    retry-backoff: 2s
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      base-url:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:}
      base-url:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
      base-url:

  # 학습 대화 개념 분석. 외부 모델로 보내는 양과 호출 횟수(=비용)를 줄이는 값
  analysis:
    max-input-chars: 30000
    max-message-chars: 1500
    # 키워드가 들어간 메시지 앞뒤로 함께 보낼 메시지 수
    context-window: 1
    max-output-tokens: 4000
    # 사용자 한 명이 24시간 안에 시작할 수 있는 분석 수 (분석 한 번에 모델 최대 3번 호출)
    daily-run-limit: 10
    running-timeout: 10m

  # 퀴즈 만들기·AI 채점 (domain/quiz). 키가 없으면 만들기는 503, 주관식 의미 판단·서술형 채점은 "채점 대기"로 둔다
  quiz:
    # 퀴즈를 만들 때 쓸 모델 순서. 설정된 첫 모델 하나만 부르고 실패하면 남은 시간 안에서 다음 모델로 넘어간다 (gpt, claude, gemini)
    generation-providers: gpt, claude, gemini
    max-question-count: 10
    mock-exam-max-question-count: 20
    # 비용 상한 (24시간, 사용자 한 명): 만들기 요청 수, AI 채점 실행 수(처음·다시 채점), 실제 모델 요청 수(재시도·실패 포함)
    daily-generation-limit: 20
    daily-grading-limit: 30
    daily-model-call-limit: 150
    # 시간 예산. 프론트 timeout(만들기 180초, 제출·다시 채점 150초)보다 짧게 둔다
    generation-deadline: 150s
    grading-deadline: 120s
    # 마감 시각이 없는 옛 만들기 기록(V7)을 끝난 것으로 볼 시간
    running-timeout: 5m
    generation-max-output-tokens: 6000
    grading-max-output-tokens: 3000
    # 결과 판단 기준 (코드 규칙. 숙련도 점수 산식은 미결이라 여기서 만들지 않는다)
    assessment:
      min-graded-questions: 3
      ready-rate: 0.8
      concept-min-rate: 0.6

  # 학습자료 본문을 외부 AI로 보내는 기능. 기본은 꺼짐: 제공사·이전 국가·보관 기간과 처리 근거를 처리방침에 확정한 뒤에만 켠다
  # (MATERIAL_CONTENT_ENABLED=true). 꺼져 있으면 자료 본문·핵심 개념 뽑기 요청을 거절하고 과목 개념으로만 문제를 만든다
  material-content:
    enabled: ${MATERIAL_CONTENT_ENABLED:false}
    max-chars: 12000
    max-pdf-pages: 100

  # Vite 프록시를 거쳐도 브라우저의 Origin(개발 서버 주소)이 그대로 오므로 개발 서버 주소를 허용해야 한다.
  # 5173이 이미 쓰이고 있으면 Vite가 5174로 띄운다. 운영은 application-prod.yaml에서 환경변수로만 받는다
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174

  jwt:
    # Base64로 인코딩한 32바이트 이상 키. 비어 있고 allow-ephemeral-secret이 true면 실행할 때마다 임시 키를 만든다
    secret: ${JWT_SECRET:}
    allow-ephemeral-secret: true
    issuer: ai-lms
    access-token-ttl: 15m

  auth:
    refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      # 인증 API에만 쿠키가 실리게 한다
      path: /api/auth
      # http://localhost 개발 환경에서는 false, 운영(HTTPS)은 true
      secure: false
      # 프론트와 API가 같은 출처(Vite 프록시·Vercel rewrite)라 Strict로 충분하다
      same-site: Strict
    login-attempt:
      # 같은 이메일·같은 IP에서 window 동안 max-failures번 틀리면 lock-duration 동안 막는다
      max-failures: 5
      window: 15m
      lock-duration: 15m
      # 한 IP에서 여러 이메일로 시도하는 경우
      max-failures-per-ip: 50
