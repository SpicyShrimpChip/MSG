# 운영 설정 (SPRING_PROFILES_ACTIVE=prod). 접속 정보·시크릿·출처는 모두 환경변수로만 받는다
# 운영 구성(11/23 확정): AWS EC2 한 대 + Docker Compose(Caddy → 백엔드 → PostgreSQL), deploy/·docs/deploy.md

# Caddy가 넘긴 X-Forwarded-For(브라우저 IP 하나)를 접속 IP로 쓴다. Tomcat은 사설망(도커 네트워크)에서 온 값만 믿는다.
# 없으면 모든 요청이 Caddy의 IP로 보여 로그인 시도 제한이 사용자 전체에 같이 걸린다
server:
  forward-headers-strategy: native

# 운영에서는 API 문서를 열지 않는다 (Caddy도 /api 밖은 404)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  # 예: jdbc:postgresql://db:5432/msg (deploy/compose.yaml이 넣어 준다)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    # 샘플 데이터(db/seed)는 넣지 않는다
    locations: classpath:db/migration,classpath:db/vector

app:
  # 운영 서버의 업로드 원본 폴더. 서버를 다시 배포해도 지워지지 않는 위치(도커 볼륨 uploads)로 지정한다
  storage:
    local:
      root: ${STORAGE_LOCAL_ROOT}

  # 카카오 로그인이 끝나면 돌아갈 화면 주소. 기본값(application.yaml)은 로컬 개발 서버라서 운영에서 빠뜨리면
  # 사용자가 localhost로 보내지므로, 운영은 서비스 주소를 기본값으로 둔다
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://lms-seven-tawny.vercel.app}

  cors:
    # 쉼표로 여러 출처를 넣을 수 있다 (예: https://a.example.com,https://b.example.com)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  jwt:
    secret: ${JWT_SECRET}
    allow-ephemeral-secret: false

  auth:
    refresh-cookie:
      secure: true

  # 회원가입 자동 가입 방지는 운영에서 꼭 켠다. TURNSTILE_SECRET_KEY가 비어 있으면 서버가 뜨지 않는다
  turnstile:
    required: true
