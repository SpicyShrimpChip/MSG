<title id="title">ai-lms</title>
<desc id="desc">AI와 나눈 공부 대화를 GPT·Claude·Gemini가 따로 읽고 개념별로 비교한 학습 대시보드의 한 장면. 점수 대신 모델별 판단과 같은 판단 수, AI가 쓴 설명을 보여 준다.</desc>
<defs><style>
.t { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif; }
.in { opacity: 0; animation: up .6s cubic-bezier(.2,.7,.2,1) forwards; }
.pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.3,1.5,.5,1) forwards; }
.type { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type 2.4s steps(34, end) forwards; }
.caret { opacity: 0; animation: blink 1s step-end infinite; }
.flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes type { to { transform: scaleX(1); } }
@keyframes blink { 50% { opacity: 1; } }
@keyframes flow { to { stroke-dashoffset: -28; } }
@keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .in, .pop, .caret { animation: none; opacity: 1; transform: none; }
  .type { animation: none; transform: none; }
  .flow, .pulse { animation: none; }
}
</style>
