<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">AI는 이렇게 씁니다</title>
<desc id="desc">내 컴퓨터에서 대화 파일을 읽고 개인정보를 가린 뒤, 고른 대화만 서버로 보낸다. GPT·Claude·Gemini가 따로 판단하고, 코드가 판단을 비교해 근거와 함께 대시보드에 보여 준다. 사용자는 판단에 의견을 남길 수 있다.</desc>
<defs><style>
.t { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif; }
.in { opacity: 0; animation: up .6s cubic-bezier(.2,.7,.2,1) forwards; }
.pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.3,1.5,.5,1) forwards; }
.type { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type 2.4s steps(34, end) forwards; }
.caret { opacity: 0; animation: blink 1s step-end infinite; }
.flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes type { to { transform: scaleX(1); } }
@keyframes blink { 50% { opacity: 1; } }
@keyframes flow { to { stroke-dashoffset: -28; } }
@keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .in, .pop, .caret { animation: none; opacity: 1; transform: none; }
  .type { animation: none; transform: none; }
  .flow, .pulse { animation: none; }
}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c9d3e3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x=".5" y=".5" width="1199" height="249" rx="20" fill="#ffffff" stroke="#e3e9f3"/>
<g class="in" style="animation-delay:0.00s"><rect x="36" y="46" width="204" height="166" rx="14" fill="#f4f7fd" stroke="#e3e9f3"/><circle cx="66" cy="78" r="14" fill="#45526b"/><text x="66" y="83" text-anchor="middle" class="t" font-size="14" font-weight="800" fill="#ffffff">1</text><text x="222" y="83" text-anchor="end" class="t" font-size="11.5" font-weight="700" fill="#45526b">브라우저</text><text x="56" y="124" class="t" font-size="16" font-weight="800" fill="#0f1b33">내 컴퓨터에서</text><text x="56" y="152" class="t" font-size="13" fill="#45526b">대화 파일 읽기</text><text x="56" y="174" class="t" font-size="13" fill="#45526b">공부한 대화 고르기</text><text x="56" y="196" class="t" font-size="13" fill="#45526b">개인정보 가리기</text></g>
<line x1="244" y1="129.0" x2="266" y2="129.0" stroke="#c9d3e3" stroke-width="2" class="flow" marker-end="url(#ar)"/>
<g class="in" style="animation-delay:0.25s"><rect x="270" y="46" width="204" height="166" rx="14" fill="#ffffff" stroke="#e3e9f3"/><circle cx="300" cy="78" r="14" fill="#1d4ed8"/><text x="300" y="83" text-anchor="middle" class="t" font-size="14" font-weight="800" fill="#ffffff">2</text><text x="456" y="83" text-anchor="end" class="t" font-size="11.5" font-weight="700" fill="#1d4ed8">코드</text><text x="290" y="124" class="t" font-size="16" font-weight="800" fill="#0f1b33">고른 대화만 전송</text><text x="290" y="152" class="t" font-size="13" fill="#45526b">원본 파일은 보내지 않음</text><text x="290" y="174" class="t" font-size="13" fill="#45526b">서버가 한 번 더 검사</text></g>
<line x1="478" y1="129.0" x2="500" y2="129.0" stroke="#c9d3e3" stroke-width="2" class="flow" marker-end="url(#ar)"/>
<g class="in" style="animation-delay:0.50s"><rect x="504" y="46" width="204" height="166" rx="14" fill="#f8f5ff" stroke="#ddd2fb"/><circle cx="534" cy="78" r="14" fill="#6d28d9"/><text x="534" y="83" text-anchor="middle" class="t" font-size="14" font-weight="800" fill="#ffffff">3</text><text x="690" y="83" text-anchor="end" class="t" font-size="11.5" font-weight="700" fill="#6d28d9">AI</text><text x="524" y="124" class="t" font-size="16" font-weight="800" fill="#0f1b33">세 모델이 따로 판단</text><text x="524" y="152" class="t" font-size="13" fill="#45526b">GPT · Claude · Gemini</text><text x="524" y="174" class="t" font-size="13" fill="#45526b">서로의 답은 보지 않음</text></g>
<line x1="712" y1="129.0" x2="734" y2="129.0" stroke="#c9d3e3" stroke-width="2" class="flow" marker-end="url(#ar)"/>
<g class="in" style="animation-delay:0.75s"><rect x="738" y="46" width="204" height="166" rx="14" fill="#ffffff" stroke="#e3e9f3"/><circle cx="768" cy="78" r="14" fill="#1d4ed8"/><text x="768" y="83" text-anchor="middle" class="t" font-size="14" font-weight="800" fill="#ffffff">4</text><text x="924" y="83" text-anchor="end" class="t" font-size="11.5" font-weight="700" fill="#1d4ed8">코드</text><text x="758" y="124" class="t" font-size="16" font-weight="800" fill="#0f1b33">코드가 비교·정리</text><text x="758" y="152" class="t" font-size="13" fill="#45526b">같은 판단 수 세기</text><text x="758" y="174" class="t" font-size="13" fill="#45526b">근거 메시지 확인</text></g>
<line x1="946" y1="129.0" x2="968" y2="129.0" stroke="#c9d3e3" stroke-width="2" class="flow" marker-end="url(#ar)"/>
<g class="in" style="animation-delay:1.00s"><rect x="972" y="46" width="204" height="166" rx="14" fill="#ffffff" stroke="#e3e9f3"/><circle cx="1002" cy="78" r="14" fill="#1d4ed8"/><text x="1002" y="83" text-anchor="middle" class="t" font-size="14" font-weight="800" fill="#ffffff">5</text><text x="1158" y="83" text-anchor="end" class="t" font-size="11.5" font-weight="700" fill="#1d4ed8">코드</text><text x="992" y="124" class="t" font-size="16" font-weight="800" fill="#0f1b33">대시보드와 내 의견</text><text x="992" y="152" class="t" font-size="13" fill="#45526b">개념별 판단과 근거</text><text x="992" y="174" class="t" font-size="13" fill="#45526b">"이미 알아요" 남기기</text></g>
<text x="600.0" y="234" text-anchor="middle" class="t in" style="animation-delay:1.40s" font-size="12.5" fill="#5f6b80">회색은 내 브라우저, 파랑은 코드가 계산하는 단계, 보라는 AI가 맡는 단계입니다</text>
</svg>