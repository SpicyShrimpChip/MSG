# 운영 서버(EC2 한 대)에서 띄우는 묶음: Caddy(HTTPS) → 백엔드 → PostgreSQL 16(+pgvector).
# 사용자는 Vercel 주소 하나만 쓰고, Vercel이 /api 요청을 이 서버(BACKEND_HOST)로 넘긴다. 순서·명령은 docs/deploy.md
#
# 값은 이 폴더의 두 파일에서 읽는다(둘 다 커밋하지 않는다. 예시는 env.example·backend.env.example):
#   .env          compose가 쓰는 값(주소, DB 관리자·계정 비밀번호)
#   backend.env   백엔드만 쓰는 값(JWT·AI 키 등)
# DB 포트는 밖으로 열지 않는다. 바깥에서 들어오는 길은 Caddy의 80·443뿐이다.
name: msg

# 컨테이너 로그(docker compose logs로 보는 것) 크기 제한. 도커 기본값은 제한이 없어 디스크(20GB)를 채울 수 있다.
# 디스크는 DB·업로드·7일치 백업(backups/)에 남겨 두고, 로그는 서비스마다 10MB 파일 3개(최대 30MB)까지만 남긴다.
# 바꾼 값은 컨테이너를 다시 만들 때 적용된다(./deploy.sh의 docker compose up -d가 다시 만든다)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?BACKEND_HOST를 .env에 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서. 지우면 다시 발급받는다(발급 횟수 제한이 있으니 지우지 않는다)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    # main에 머지되면 CI가 올리는 이미지(.github/workflows/backend-ci.yml). 로컬에서 만든 이미지로 시험할 때는 .env에서 바꾼다
    image: ${BACKEND_IMAGE:-ghcr.io/spicyshrimpchip/msg-backend:latest}
    logging: *default-logging
    restart: unless-stopped
    env_file: backend.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/msg
      DB_USERNAME: msg_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD를 .env에 넣어 주세요}
      DB_MIGRATION_USERNAME: msg_migrator
      DB_MIGRATION_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD를 .env에 넣어 주세요}
      STORAGE_LOCAL_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    # 2GB 서버에서 DB와 나눠 쓴다. JVM은 이 한도의 75%까지 쓴다(Dockerfile의 MaxRAMPercentage)
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
      # db-init 스크립트가 처음 한 번 계정을 만들 때만 쓴다
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 데이터 폴더가 비어 있을 때(처음 띄울 때)만 실행된다
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msg"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
